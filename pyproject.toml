[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sage-gw"
version = "0.1.0"
description = "Physics-informed representation learning for gravitational-wave discovery"
readme = "README.md"
authors = [
  { name = "Narenraju Nagarajan" },
  { name = "Christopher Messenger" },
]
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
keywords = [
  "gravitational waves",
  "compact binary coalescence",
  "machine learning",
  "deep learning",
  "signal detection",
  "matched filter",
  "LIGO",
  "PyTorch",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "h5py>=3.8",
  "tqdm>=4.65",
  "matplotlib>=3.7",
  "scikit-learn>=1.3",
  "astropy>=5.3",
  "gwpy>=3.0",
  "torch>=2.1",
  # Read by sage.data.waveform.sampler.read_from_config, which parses the
  # gwconfig.yaml on the main training path — not optional.
  "pyyaml>=6.0",
]

[project.optional-dependencies]
lal = [
  "lalsuite>=7.0",
  "pycbc>=2.2",
]
# GWOSC data download and segment preparation (sage.data.primer).
download = [
  "requests>=2.28",
  "urllib3>=1.26",
  "gwosc>=0.7",
]
# Quality-diversity hard-noise mining (sage.data.noise.cma_mae_mining).
mining = [
  "ribs>=0.7",
]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/nnarenraju/sage"
Documentation = "https://sage-gw.readthedocs.io"
Repository = "https://github.com/nnarenraju/sage"
"Bug Tracker" = "https://github.com/nnarenraju/sage/issues"
Paper = "https://doi.org/10.1103/zwj9-ycyz"
Zenodo = "https://doi.org/10.5281/zenodo.20375078"

[tool.setuptools.packages.find]
where = ["."]
include = ["sage*"]
exclude = ["sage.egg-info*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
# An xfail that starts passing is reported as a failure. Unimplemented search tests are
# marked xfail(raises=NotImplementedError) while their module is a stub; implementing the
# module makes the test pass, which fails the run until the marker is removed. That is the
# intended ratchet, so the strictness must not be optional.
xfail_strict = true
markers = [
    "gpu: needs a CUDA device",
    "data: needs a strain release on project storage",
    "net: needs network access to an external service",
    "slow: takes long enough to be worth deselecting during development",
]

[tool.coverage.run]
source = ["sage"]
omit = [
    "sage/plotting/*",
    "sage/benchmark/*",
    "sage/data/primer/*",
    # Standalone scripts run by hand, never imported by the pipeline.
    "sage/diagnostics/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.black]
line-length = 88

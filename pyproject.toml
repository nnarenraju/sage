[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sage"
version = "0.0.1"
description = "Sage: Discovering gravitational-wave transients using ML"
authors = [{ name = "Narenraju Nagarajan" }]
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["."]
include = ["sage*"]

[tool.black]
line-length = 88

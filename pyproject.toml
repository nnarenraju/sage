[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sage-gw"
version = "0.1.0"
description = "Physics-informed representation learning for gravitational-wave discovery"
readme = "README.md"
authors = [
  { name = "Narenraju Nagarajan" },
  { name = "Christopher Messenger" },
]
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
keywords = [
  "gravitational waves",
  "compact binary coalescence",
  "machine learning",
  "deep learning",
  "signal detection",
  "matched filter",
  "LIGO",
  "PyTorch",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "h5py>=3.8",
  "tqdm>=4.65",
  "matplotlib>=3.7",
  "scikit-learn>=1.3",
  "astropy>=5.3",
  "gwpy>=3.0",
  "torch>=2.1",
  # Run files, priors and the run record are YAML -- not optional.
  "pyyaml>=6.0",
  # Imported at module level on the training path (sage.dsp.filters,
  # sage.dsp.multirate_sampling) and by the search -- not optional.
  "lalsuite>=7.0",
  "pycbc>=2.2",
]

# Every command is `sage <command>`; `sgw` and `sage-<command>` run the same code.
[project.scripts]
sage = "sage.cli:main"
sgw = "sage.cli:main"
sage-chain = "sage.cli:main"
sage-check = "sage.cli:main"
sage-clone = "sage.cli:main"
sage-compare = "sage.cli:main"
sage-copy-prior = "sage.cli:main"
sage-download = "sage.cli:main"
sage-help = "sage.cli:main"
sage-init = "sage.cli:main"
sage-list = "sage.cli:main"
sage-log = "sage.cli:main"
sage-machine = "sage.cli:main"
sage-machine-setup = "sage.cli:main"
sage-plot = "sage.cli:main"
sage-show = "sage.cli:main"
sage-status = "sage.cli:main"
sage-stop = "sage.cli:main"
sage-train = "sage.cli:main"
sage-validate = "sage.cli:main"

[project.optional-dependencies]
# GWOSC data download and segment preparation (sage.data.primer).
download = [
  "requests>=2.28",
  "urllib3>=1.26",
  "gwosc>=0.7",
]
# Quality-diversity hard-noise mining (sage.data.noise.cma_mae_mining).
mining = [
  "ribs>=0.7",
]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/nnarenraju/sage"
Documentation = "https://sage-gw.readthedocs.io"
Repository = "https://github.com/nnarenraju/sage"
"Bug Tracker" = "https://github.com/nnarenraju/sage/issues"
Paper = "https://doi.org/10.1103/zwj9-ycyz"
Zenodo = "https://doi.org/10.5281/zenodo.20375078"

[tool.setuptools.packages.find]
where = ["."]
include = ["sage*"]
exclude = ["sage.egg-info*"]

[tool.setuptools.package-data]
"sage.presets" = ["runs/*.yaml", "priors/*.yaml", "waveform_priors/*.yaml"]
"sage.plotting" = ["style/*.mplstyle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
# An xfail that starts passing is reported as a failure. Unimplemented search tests are
# marked xfail(raises=NotImplementedError) while their module is a stub; implementing the
# module makes the test pass, which fails the run until the marker is removed. That is the
# intended ratchet, so the strictness must not be optional.
xfail_strict = true
markers = [
    "gpu: needs a CUDA device",
    "data: needs a strain release on project storage",
    "net: needs network access to an external service",
    "slow: takes long enough to be worth deselecting during development",
]

[tool.coverage.run]
source = ["sage"]
omit = [
    "sage/plotting/*",
    "sage/benchmark/*",
    "sage/data/primer/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.black]
line-length = 88

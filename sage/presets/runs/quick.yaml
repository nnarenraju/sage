# A quick check of a setup or a code change: hl_mining with small counts, about 10 minutes on one GPU.
# Mining keeps every window it finds, so the bank and its replay are exercised.
data:
  detectors: [H1, L1]
  sample_rate_in_hz: 2048
  sample_length_in_s: 12
  padding_length_in_s: 2
  dtype: float32
signal:
  prior: bbh_narrow
  low_frequency_cutoff_in_hz: 20
  reference_frequency_in_hz: 20
  waveform: {name: IMRPhenomPv2}
  projection: {name: constant}
  snr: {name: halfnorm, scale: 4.0, loc: 5.0}
  targets: [tc, mchirp]
noise:
  training: {name: real, runs: [o3b]}
  validation: {name: real, runs: [o3a]}
  recolour: {target: o3a, probability: 0.37, asd_jitter_gain: 0.5, validation: false}
  fiducial: [o3a, o3b]
  prefetch_batches: 8
  read_workers: 16
preprocess:
  - name: whiten
  - name: multirate
    lowest_sample_rate_in_hz: 64
    nyquist_margin_in_hz: 20
    min_bin_length_in_s: 0.05
    pre_merger_leeway_in_s: 0
    post_merger_leeway_in_s: 0
model: {name: MSCNN1Datt_2DResNetCBAM}
loss: {name: BCE_PE_Sigma}
optimiser: {name: AdamW}
schedule: {name: WarmupPolynomialDecayFlatTail, warmup_steps: 20, flat_tail_epochs: 1}
train:
  epochs: 6
  samples_per_epoch: 6400
  batch_size: 64
  signal_fraction: 0.5
  device: cuda
  precision: bf16
  clip_norm: 100.0
  compile: false
  seed: 150914
  keep_checkpoints: 2
validation:
  samples: 6400
  every_n_epochs: 2
  final_samples: 25600
  seed: 170817
  snr: {name: halfnorm, scale: 4.0, loc: 5.0}
mining: {enabled: true, start_epoch: 1, every_n_epochs: 2, iterations: 400, keep_threshold: -1.0e+30}
ema: {enabled: true, calibration_batches: 50}

name: sage
channels:
  - conda-forge
  - nodefaults
dependencies:
  # Python runtime
  - python=3.11

  # Core numerics
  - numpy>=1.24
  - scipy>=1.10
  - pandas>=2.0
  - h5py>=3.8
  - tqdm>=4.65
  - scikit-learn>=1.3

  # Plotting
  - matplotlib>=3.7

  # Astronomy / GW stack
  - astropy>=5.3
  - lalsuite>=7.0
  - pycbc>=2.2
  - gwpy>=3.0

  # Notebook
  - jupyterlab>=4.0
  - ipykernel>=6.0
  - ipywidgets

  # pip is needed for the post-install step in create_env.sh
  - pip

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax-check:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: python -m py_compile $(git ls-files 'sage/**.py' | tr '\n' ' ')

  import-check:
    name: Import smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Installs WITHOUT --no-deps, so this job also verifies that the
      # dependency set declared in pyproject.toml actually resolves.
      - name: Install package and declared dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .

      - name: Smoke test package imports
        run: |
          python - <<'PY'
          import importlib
          import pkgutil

          import sage

          names = 0
          for info in pkgutil.walk_packages(sage.__path__, "sage."):
              if not info.ispkg:
                  continue
              package = importlib.import_module(info.name)
              public = getattr(package, "__all__", [])
              missing = [name for name in public if not hasattr(package, name)]
              assert not missing, f"{info.name}.__all__ names missing: {missing}"
              names += len(public)
          print(f"every sage package imports; {names} public names present")
          PY

      - name: Smoke test the command line
        run: |
          sage --version
          sage list presets

  tests:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,mining]"

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --tb=short \
            --cov=sage --cov-branch --cov-report=xml --cov-report=term-missing \
            --junitxml=junit.xml -o junit_family=legacy

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax-check:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: python -m py_compile $(git ls-files 'sage/**.py' | tr '\n' ' ')

  import-check:
    name: Import smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Installs WITHOUT --no-deps, so this job also verifies that the
      # dependency set declared in pyproject.toml actually resolves.
      - name: Install package and declared dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .

      - name: Smoke test core imports
        run: |
          python - <<'PY'
          import sage.dsp
          from sage.dsp import (
              FrequencyBand, FrequencyBandLayout, FrequencyMultibandCompressor,
              describe_layout,
              make_dyadic_frequency_bands, make_prior_informed_frequency_bands,
              make_empirical_frequency_bands,
              heterodyne, apply_phase,
              analytic_signal, instantaneous_frequency,
              decimate, halfband_kernel, rate_and_factor,
          )
          missing = [n for n in sage.dsp.__all__ if not hasattr(sage.dsp, n)]
          assert not missing, f"__all__ names missing from sage.dsp: {missing}"
          print(f"sage.dsp imports OK ({len(sage.dsp.__all__)} public names)")
          PY

      - name: Smoke test the documented training-path imports
        run: |
          python - <<'PY'
          from sage.data.waveform import read_from_config, ConstantProjection, IMRPhenomPv2
          from sage.data.noise import MemmapNoiseSampler, RecolourPostprocess
          from sage.dsp.whiten import FiducialWhitening
          from sage.dsp.multirate_sampling import MultirateSampler, DyadicPyramidBinning
          from sage.architecture.network import MSCNN1D_2DResNetCBAM_Heteroscedastic
          from sage.factory.training import SageVanillaTraining
          from sage.factory.validation import SageVanillaValidation
          from sage.core.graph import Preprocessor
          print("training-path imports OK")
          PY

  tests:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,mining]"

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --tb=short \
            --cov=sage --cov-branch --cov-report=xml --cov-report=term-missing \
            --junitxml=junit.xml -o junit_family=legacy

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # Waveform correctness against LALSim. Kept separate from `tests` so that a
  # lalsuite/pycbc packaging problem shows up as its own red job instead of
  # masking an ordinary test failure. Without this job the ~80 physics tests
  # silently `importorskip` and never run.
  physics:
    name: Waveform validation vs LALSim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install with LALSuite
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,mining,lal]"

      - name: Confirm LALSim is actually importable
        run: |
          python -c "import pycbc, lalsimulation; print('pycbc', pycbc.__version__)"

      - name: Run waveform validation
        run: |
          pytest tests/ -v --tb=short -k "waveform or bns or multiband or recolour"
